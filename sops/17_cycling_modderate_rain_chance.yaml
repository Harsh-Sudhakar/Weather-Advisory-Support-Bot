id: cycling_moderate_rain_chance
title: Moderate chace of rain for cycling and outdoor exervises
verdict: Safe, but carry rain gear
category: outdoor_exercise
severity:  low
priority: 8
requires_facts: [precip_prob_pct, wind_kmh, apparent_temp_c]
when:
  - {fact: activity_category, op: includes_any, value: [outdoor_exercise, travel_commute]}
  - {fact: precip_prob_pct, op: between, value : [40.1, 69.9]}
  - {fact: wind_kmh, op: lte, value: 40}
  - {fact: apparent_temp_c, op: between, value: [5,38]}
guidance: >
  Wind and temperature are within safe limits so the ride is not unsafe on the weather alone.
  Rain is possible rather than linkely. Tell the user it is fine to go, give the actual rain chance and the wind reading, and advance carrying a rain layer,
  taking extra care on wet road surfaces,
  braking earlier , and choosing a route they can shorten it it starts to rain. 